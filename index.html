<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Функция мен объект</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      margin-top: 60px;
    }
    #box {
      width: 200px;
      height: 200px;
      background-color: rgb(81, 255, 0);
      margin: 20px auto;
      border-radius: 10px;
      line-height: 200px;
      font-weight: bold;
      transition: 0.3s;
    }
    button {
      padding: 10px 18px;
      margin: 8px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #008cff;
      color: white;
      font-size: 16px;
    }
    button:hover {
      background: #ffd000;
    }
    .task {
      background: white;
      border-radius: 12px;
      width: 500px;
      margin: 40px auto;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: left;
    }
  </style>
</head>
<body>

  <h1>Функция және объект мысалы</h1>
  <div id="box">HTML объект</div>

  <button onclick="tusOzgertu()">🎨 Түсін өзгерт</button>
  <button onclick="ulsheminOzgertu()">📏 Өлшемін үлкейту</button>
  <button onclick="matinniOzgertu()">✏️ Мәтінді өзгерту</button>


  <script>
    
    function tusOzgertu() {
      let box = document.getElementById("box");
      let tuster = ["red", "orange", "blue", "purple", "yellow", "green"];
      let rand = Math.floor(Math.random() * tuster.length);
      box.style.backgroundColor = tuster[rand];
    }

    function ulsheminOzgertu() {
      let box = document.getElementById("box");
      let size = Math.floor(Math.random() * 100) + 150;
      box.style.width = size + "px";
      box.style.height = size + "px";
      box.innerText = size + " px";
    }

    function matinniOzgertu() {
      let box = document.getElementById("box");
      let sozder = ["Сәлем!", "HTML объект!", "JS күшті!", "Функция істеді!", "Бәрекелді!"];
      let rand = Math.floor(Math.random() * sozder.length);
      box.innerText = sozder[rand];
    }
  </script>

</body>
</html>

<br><br><br><br>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Функция және объект</title>
</head>
<body>

<h2 id="title">Бастапқы мәтін</h2>
<button onclick="ozgertu()">Өзгерту</button>

<script>
  function ozgertu() {
    // HTML объектісін табу
    let textObj = document.getElementById("title");
    // Оның қасиетін өзгерту
    textObj.innerText = "Мәтін өзгертілді!";
  }
</script>

</body>
</html>
